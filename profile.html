<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NyashBoard ♡ — Профиль</title>
  <script>
    // Тема применяется до отрисовки, иначе при каждом переходе между вкладками
    // страница мигает оформлением по умолчанию, пока подгружаются модули.
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem("nyash_settings")) || {};
        var r = document.documentElement;
        r.dataset.theme = s.theme || "default";
        r.dataset.accent = s.accent || "pink";
        r.dataset.particles = s.particles || "stars";
        r.dataset.emoji = s.emoji || "noto";
        r.dataset.time = s.timeFormat || "relative";
        r.dataset.tz = s.timezone || "auto";
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="assets/favicon.svg?v=20260904" type="image/svg+xml" sizes="any">
  <link rel="apple-touch-icon" href="assets/favicon.svg?v=20260904">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#17131c">
  <link rel="stylesheet" href="style.css?v=20260904">
</head>
<body>

<header id="navHost"></header>

<main id="app">
  <section class="tab active">

    <div id="profileLoggedOutNote" class="stub-note">
      <p>Ты не вошёл(а) ♡</p>
      <button id="pageLoginBtn" class="primaryBtn" style="width:auto; padding:10px 22px;">Войти через Google</button>
    </div>

    <div id="profileForm" class="hidden">
      <div class="profile-page-head">
        <span class="avatar-wrap" style="width:88px;height:88px;">
          <img id="pageAvatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" class="avatar-shaped shape-circle" style="width:88px;height:88px;cursor:pointer;" title="нажми, чтобы сменить">
          <span class="avatar-status" id="pageStatus"></span>
        </span>
        <input type="file" id="avatarInput" accept="image/*" hidden>
        <p class="muted" style="margin:6px 0 0;">нажми на аватарку, чтобы сменить</p>

        <div id="shapePickerHost"></div>
        <div class="muted" style="font-size:12px; margin-top:14px;">Украшение</div>
        <div id="accessoryPickerHost"></div>
        <div class="muted" style="font-size:12px; margin-top:14px;">Цвет рамки и украшения</div>
        <div id="colorPickerHost"></div>

        <div style="display:flex; align-items:center; gap:8px; justify-content:center; margin-top:12px;">
          <span class="muted" style="font-size:13px;">Статус:</span>
          <span style="position:relative;">
            <button id="statusEmojiBtn" class="secondaryBtn" style="width:auto; margin:0; padding:6px 14px;">
              <span id="statusEmojiPreview">выбрать</span>
            </button>
          </span>
          <button id="clearStatusBtn" type="button">убрать</button>
        </div>

        <input id="nicknameInput" class="inlineEdit" placeholder="Ник" maxlength="24" style="margin-top:16px;">
        <div class="username-row"><span class="at-sign">@</span><input id="usernameInput" class="inlineEdit" placeholder="username" maxlength="20"></div>
        <textarea id="bioInput" class="bioInput" placeholder="Описание профиля — расскажи о себе" maxlength="300"></textarea>
        <div class="uid-row">NUID: <code id="uidDisplay"></code><br><span class="muted">(неизменно, не отправляй кому попало)</span></div>
        <div class="setting-row" style="justify-content:center; gap:10px; border:none; padding-top:10px;">
          <span class="muted" style="font-size:13px;">Обращаться ко мне:</span>
          <select id="genderSelect" class="settingSelect">
            <option value="m">в мужском роде</option>
            <option value="f">в женском роде</option>
            <option value="x">нейтрально</option>
          </select>
        </div>
        <div class="setting-row" style="justify-content:center; gap:10px; border:none; padding-top:10px;">
          <span class="muted" style="font-size:13px;">Кто видит меня как автора в репостах:</span>
          <select id="repostVisibility" class="settingSelect">
            <option value="everyone">Все</option>
            <option value="reposters">Только репостнувшие</option>
            <option value="nobody">Никто</option>
          </select>
        </div>
        <div class="setting-row" style="justify-content:center; gap:10px; border:none; padding-top:10px;">
          <span class="muted" style="font-size:13px;">Кто видит мой NUID:</span>
          <select id="nuidVisibility" class="settingSelect">
            <option value="everyone">Все</option>
            <option value="friends">Только друзья</option>
            <option value="nobody">Никто</option>
          </select>
        </div>
      </div>

      <button id="saveProfileBtn" class="primaryBtn">Сохранить профиль</button>
      <hr>
      <button id="logoutBtnPage" class="dangerBtn">Выйти</button>
    </div>

  </section>
</main>

<!-- ВЫПАДАШКА ПРОФИЛЯ -->
<div id="profileDropdown" class="profile-dropdown hidden">
  <div id="ddLoggedOut">
    <p class="muted" style="margin-top:0;">Ты пока не в аккаунте</p>
    <button id="googleLoginBtn" class="primaryBtn">Войти через Google</button>
    <hr>
    <a href="settings.html" class="dropdownBtn"><span class="nf">&#xf013;</span> Настройки</a>
  </div>
  <div id="ddLoggedIn" class="hidden">
    <div class="dropdown-user-row">
      <img id="ddAvatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" class="avatar-sm">
      <div>
        <div id="ddNickname" class="nick-sm"></div>
        <div id="ddUsername" class="muted" style="font-size:12px;"></div>
      </div>
    </div>
    <a href="profile.html" class="dropdownBtn"><span class="nf">&#xf007;</span> Профиль</a>
    <a href="my-channels.html" class="dropdownBtn"><span class="nf">&#xf292;</span> Мои каналы</a>
    <a href="settings.html" class="dropdownBtn"><span class="nf">&#xf013;</span> Настройки</a>
    <hr>
    <button id="logoutBtn" class="dangerBtn">Выйти</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module" src="js/profile-page.js?v=20260904"></script>
</body>
</html>
