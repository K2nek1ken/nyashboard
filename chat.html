<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NyashBoard ♡ — Чат</title>
  <script>
    // Тема применяется до отрисовки, иначе при каждом переходе между вкладками
    // страница мигает оформлением по умолчанию, пока подгружаются модули.
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem("nyash_settings")) || {};
        var r = document.documentElement;
        r.dataset.theme = s.theme || "default";
        r.dataset.accent = s.accent || "pink";
        r.dataset.particles = s.particles || "stars";
        r.dataset.emoji = s.emoji || "noto";
        r.dataset.time = s.timeFormat || "relative";
        r.dataset.tz = s.timezone || "auto";
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="assets/favicon.svg?v=20260906" type="image/svg+xml" sizes="any">
  <link rel="apple-touch-icon" href="assets/favicon.svg?v=20260906">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#17131c">
  <link rel="stylesheet" href="style.css?v=20260906">
</head>
<body class="chat-page-body">

<header id="navHost"></header>

<main id="app">
  <section id="tab-chat" class="tab active">
    <div id="chatMessages" class="chat-messages"></div>
  </section>
</main>

<div class="chat-floating-bar">
  <div class="chat-floating-inner">
    <div class="chat-nick-row">
      <span>ник: <b id="chatNickLabel">гость</b></span>
      <span id="changeChatNickBtn" class="nf" title="сменить ник">&#xf040;</span>
      <button id="botHelpBtn" type="button" class="chat-hint-btn">команды</button>
    </div>
    <div id="accountToggleRow" class="chat-account-row hidden">
      <label class="chat-account-label">
        <input type="checkbox" id="asAccountToggle">
        <span>от имени своего аккаунта</span>
      </label>
    </div>
    <div id="chatImagePreview" class="image-preview hidden"></div>
    <div id="replyComposeHost"></div>
    <form id="chatForm" class="chat-input-row" style="position:relative;">
      <label class="attachBtn nf" for="chatImageInput" title="фото">&#xf0c6;</label>
      <input type="file" id="chatImageInput" accept="image/*" multiple style="display:none;">
      <input type="text" id="chatInput" placeholder="Сообщение..." autocomplete="off">
      <button type="button" id="chatEmojiBtn" class="sendBtn nf" title="эмодзи">&#xf118;</button>
      <button type="submit" class="sendBtn nf" title="отправить">&#xf1d8;</button>
    </form>
  </div>
</div>

<!-- ВЫПАДАШКА ПРОФИЛЯ (не модалка — открывается прямо у иконки) -->
<div id="profileDropdown" class="profile-dropdown hidden">
  <div id="ddLoggedOut">
    <p class="muted" style="margin-top:0;">Ты пока не в аккаунте</p>
    <button id="googleLoginBtn" class="primaryBtn">Войти через Google</button>
    <hr>
    <a href="settings.html" class="dropdownBtn"><span class="nf">&#xf013;</span> Настройки</a>
  </div>
  <div id="ddLoggedIn" class="hidden">
    <div class="dropdown-user-row">
      <img id="ddAvatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" class="avatar-sm">
      <div>
        <div id="ddNickname" class="nick-sm"></div>
        <div id="ddUsername" class="muted" style="font-size:12px;"></div>
      </div>
    </div>
    <a href="profile.html" class="dropdownBtn"><span class="nf">&#xf007;</span> Профиль</a>
    <a href="my-channels.html" class="dropdownBtn"><span class="nf">&#xf292;</span> Мои каналы</a>
    <a href="settings.html" class="dropdownBtn"><span class="nf">&#xf013;</span> Настройки</a>
    <hr>
    <button id="logoutBtn" class="dangerBtn">Выйти</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module" src="js/chat-page.js?v=20260906"></script>
</body>
</html>
