<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NyashBoard ♡ — Тег</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="navHost"></header>

<main id="app">
  <section class="tab active">
    <div class="section-title" style="margin-top:0;">
      <span class="nf">&#xf292;</span> <span id="tagTitle">тег</span>
    </div>
    <div id="tagPosts" class="feed-list"><div class="stub-note">Загружаю...</div></div>
  </section>
</main>

<!-- ПРОСМОТР ЧУЖОГО ПРОФИЛЯ -->
<div id="viewProfileModal" class="modal hidden">
  <div class="modal-content">
    <button class="closeBtn modalClose" id="closeViewProfile"><span class="nf">&#xf00d;</span></button>
    <div class="profile-head">
      <span class="avatar-wrap" style="width:64px;height:64px;">
        <img id="vpAvatar" src="assets/anon.svg" class="avatar-shaped shape-circle" style="width:64px;height:64px;">
        <span class="avatar-status" id="vpStatus"></span>
      </span>
      <div>
        <div id="vpNickname" class="nick-lg"></div>
        <div class="muted">@<span id="vpUsername"></span></div>
        <div class="profile-bio" id="vpBio" style="font-size:13px;"></div>
      </div>
    </div>
    <a id="vpFullProfileLink" href="#" class="viewFullProfileLink">Открыть профиль полностью &#8594;</a>
    <div id="vpPosts" class="feed-list"></div>
  </div>
</div>

<!-- ВЫПАДАШКА ПРОФИЛЯ (не модалка — открывается прямо у иконки) -->
<div id="profileDropdown" class="profile-dropdown hidden">
  <div id="ddLoggedOut">
    <p class="muted" style="margin-top:0;">Ты не вошёл(а) ♡</p>
    <button id="googleLoginBtn" class="primaryBtn">Войти через Google</button>
  </div>
  <div id="ddLoggedIn" class="hidden">
    <div class="dropdown-user-row">
      <img id="ddAvatar" src="assets/anon.svg" class="avatar-sm">
      <div>
        <div id="ddNickname" class="nick-sm"></div>
        <div id="ddUsername" class="muted" style="font-size:12px;"></div>
      </div>
    </div>
    <a href="profile.html" class="dropdownBtn"><span class="nf">&#xf007;</span> Профиль</a>
    <a href="my-channels.html" class="dropdownBtn"><span class="nf">&#xf292;</span> Мои каналы</a>
    <a href="settings.html" class="dropdownBtn"><span class="nf">&#xf013;</span> Настройки</a>
    <hr>
    <button id="logoutBtn" class="dangerBtn">Выйти</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module" src="js/tag-page.js"></script>
</body>
</html>
