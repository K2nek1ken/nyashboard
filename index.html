<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NyashBoard ♡ — Лента</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/favicon.svg">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#17131c">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header id="navHost"></header>

<main id="app">
  <section id="tab-feed" class="tab active">
    <!-- строка создания записи: видна только на широком экране, на телефоне
         вместо неё плавающая «+» -->
    <div id="inlineComposer" class="inline-composer">
      <textarea id="icText" placeholder="Что у тебя нового? ♡" rows="1"></textarea>
      <div id="icStrip" class="image-strip"></div>
      <div class="inline-composer-bottom">
        <label class="attachBtn nf" for="icImages" title="фото">&#xf0c6;</label>
        <input type="file" id="icImages" accept="image/*" multiple hidden>
        <button type="button" id="icEmoji" class="attachBtn nf" title="эмодзи">&#xf118;</button>
        <label class="toggle-anon" style="margin-left:0;">
          <input type="checkbox" id="icAnon">
          <span id="icAnonLabel">от своего имени</span>
        </label>
        <span class="muted" id="icHint" style="font-size:12px;"></span>
        <button id="icPublish" class="publishBtn" style="margin-left:auto;">Опубликовать</button>
      </div>
    </div>

    <div id="feedList" class="feed-list"></div>
    <button id="newPostFab" class="fab"><span class="nf"></span></button>
  </section>
</main>

<!-- ПОЛНОЭКРАННЫЙ РЕДАКТОР ПОСТА -->
<div id="postEditor" class="post-editor hidden">
  <div class="post-editor-top">
    <span id="editorTitle" class="muted">Новый пост</span>
    <label class="toggle-anon" id="anonToggleRow">
      <input type="checkbox" id="postAnonToggle">
      <span id="postAnonLabel">от своего имени</span>
    </label>
    <button id="closeEditorBtn" class="closeBtn"><span class="nf">&#xf00d;</span></button>
  </div>
  <textarea id="postTextArea" placeholder="Что у тебя нового? ♡"></textarea>
  <div id="postImageStrip" class="image-strip"></div>
  <div class="post-editor-bottom">
    <label class="attachBtn" for="postImageInput"><span class="nf">&#xf0c6;</span></label>
    <input type="file" id="postImageInput" accept="image/*" multiple hidden>
    <span class="muted" id="imageCountHint" style="font-size:12px;"></span>
    <button id="publishPostBtn" class="publishBtn">Опубликовать</button>
  </div>
</div>

<!-- ВЫПАДАШКА ПРОФИЛЯ (не модалка — открывается прямо у иконки) -->
<div id="profileDropdown" class="profile-dropdown hidden">
  <div id="ddLoggedOut">
    <p class="muted" style="margin-top:0;">Ты пока не в аккаунте</p>
    <button id="googleLoginBtn" class="primaryBtn">Войти через Google</button>
    <hr>
    <a href="settings.html" class="dropdownBtn"><span class="nf">&#xf013;</span> Настройки</a>
  </div>
  <div id="ddLoggedIn" class="hidden">
    <div class="dropdown-user-row">
      <img id="ddAvatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" class="avatar-sm">
      <div>
        <div id="ddNickname" class="nick-sm"></div>
        <div id="ddUsername" class="muted" style="font-size:12px;"></div>
      </div>
    </div>
    <a href="profile.html" class="dropdownBtn"><span class="nf">&#xf007;</span> Профиль</a>
    <a href="my-channels.html" class="dropdownBtn"><span class="nf">&#xf292;</span> Мои каналы</a>
    <a href="settings.html" class="dropdownBtn"><span class="nf">&#xf013;</span> Настройки</a>
    <hr>
    <button id="logoutBtn" class="dangerBtn">Выйти</button>
  </div>
</div>

<!-- ПРОСМОТР ЧУЖОГО ПРОФИЛЯ -->
<div id="viewProfileModal" class="modal hidden">
  <div class="modal-content">
    <button class="closeBtn modalClose" id="closeViewProfile"><span class="nf"></span></button>
    <div class="profile-head">
      <span class="avatar-wrap" style="width:64px;height:64px;">
        <img id="vpAvatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" class="avatar-shaped shape-circle" style="width:64px;height:64px;">
        <span class="avatar-status" id="vpStatus"></span>
      </span>
      <div>
        <div id="vpNickname" class="nick-lg"></div>
        <div class="muted">@<span id="vpUsername"></span></div>
        <div class="profile-bio" id="vpBio" style="font-size:13px;"></div>
      </div>
    </div>
    <a id="vpFullProfileLink" href="#" class="viewFullProfileLink">Открыть профиль полностью &#8594;</a>
    <div id="vpPosts" class="feed-list"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module" src="js/feed-page.js"></script>
</body>
</html>
