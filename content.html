<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NyashBoard ♡ — Контент</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="navHost"></header>

<main id="app">
  <section id="tab-content" class="tab active">
    <input id="channelSearch" class="searchBox" placeholder="Поиск по названию, @юзернейму, NUID или описанию...">

    <div id="suggestedBlock">
      <div class="section-title">Рекомендуем ♡</div>
      <div id="suggestedList" class="channel-list"></div>
    </div>

    <div id="allBlock">
      <div class="section-title">Все каналы</div>
      <div id="allChannelsList" class="channel-list"></div>
    </div>

    <button id="newChannelFab" class="fab"><span class="nf">&#xf067;</span></button>
  </section>
</main>

<!-- МОДАЛКА СОЗДАНИЯ КАНАЛА -->
<div id="createChannelModal" class="modal hidden">
  <div class="modal-content">
    <button class="closeBtn modalClose" id="closeCreateChannel"><span class="nf">&#xf00d;</span></button>
    <h2>Новый канал</h2>
    <p class="muted">Канал создаётся анонимно — твой профиль нигде не привязывается к нему.</p>
    <div class="create-channel-form">
      <input id="channelNameInput" placeholder="Название канала">
      <textarea id="channelDescInput" placeholder="Описание — по нему будут находить и рекомендовать канал"></textarea>
    </div>
    <button id="createChannelBtn" class="primaryBtn">Создать</button>
  </div>
</div>

<!-- ВЫПАДАШКА ПРОФИЛЯ (не модалка — открывается прямо у иконки) -->
<div id="profileDropdown" class="profile-dropdown hidden">
  <div id="ddLoggedOut">
    <p class="muted" style="margin-top:0;">Ты не вошёл(а) ♡</p>
    <button id="googleLoginBtn" class="primaryBtn">Войти через Google</button>
  </div>
  <div id="ddLoggedIn" class="hidden">
    <div class="dropdown-user-row">
      <img id="ddAvatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" class="avatar-sm">
      <div>
        <div id="ddNickname" class="nick-sm"></div>
        <div id="ddUsername" class="muted" style="font-size:12px;"></div>
      </div>
    </div>
    <a href="profile.html" class="dropdownBtn"><span class="nf">&#xf007;</span> Профиль</a>
    <a href="my-channels.html" class="dropdownBtn"><span class="nf">&#xf292;</span> Мои каналы</a>
    <a href="settings.html" class="dropdownBtn"><span class="nf">&#xf013;</span> Настройки</a>
    <hr>
    <button id="logoutBtn" class="dangerBtn">Выйти</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module" src="js/content-page.js"></script>
</body>
</html>
