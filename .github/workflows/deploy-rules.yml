# Автодеплой правил Firestore при пуше в main.
#
# Настройка один раз, в репозитории → Settings → Secrets and variables → Actions:
#   FIREBASE_SERVICE_ACCOUNT — содержимое json-ключа целиком
#   FIREBASE_PROJECT_ID      — идентификатор проекта (например, nyashboard)
#
# Ключ берётся в Firebase: Project settings → Service accounts →
# Generate new private key. Сервисный аккаунт бесплатен и к платному тарифу
# отношения не имеет.
#
# ВАЖНО про права: у сервисного аккаунта должна быть роль
# «Firebase Rules Admin» либо «Firebase Admin». Со стандартной ролью
# редактора деплой правил падает с exit code 1 — это самая частая причина.

name: Deploy Firestore rules

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firebase.json"
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Проверяем, что секреты вообще заданы: без этого команда падает
      # с невнятной ошибкой, и непонятно, дело в ключе или в правилах.
      - name: Check secrets
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "::error::Секрет FIREBASE_SERVICE_ACCOUNT не задан"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_PROJECT_ID }}" ]; then
            echo "::error::Секрет FIREBASE_PROJECT_ID не задан"
            exit 1
          fi

      - name: Write credentials
        run: |
          cat > "$RUNNER_TEMP/service-account.json" <<'JSON'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          JSON
          # проверяем, что это действительно json, а не обрезанная строка
          node -e "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/service-account.json','utf8'))" \
            || { echo "::error::Ключ не читается как JSON — проверь, что секрет скопирован целиком"; exit 1; }

      - name: Deploy rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
        run: |
          firebase deploy --only firestore:rules \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" \
            --non-interactive \
            --debug

      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"
