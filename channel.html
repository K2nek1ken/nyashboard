<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NyashBoard ♡ — Канал</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="navHost"></header>

<main id="app">
  <section class="tab active">

    <div id="chHead" class="profile-page-head" style="text-align:left; display:flex; gap:14px; align-items:center; padding:14px 0;">
      <img id="chAvatar" src="assets/anon.svg" class="avatar-lg" style="width:72px;height:72px;">
      <div>
        <div id="chName" class="nick-lg"></div>
        <div class="muted">@<span id="chUsername"></span></div>
        <div class="muted" id="chNuid" style="font-size:11px;"></div>
      </div>
    </div>
    <div id="chDescription" class="muted" style="padding-bottom:14px;"></div>

    <div id="chSubscribeRow" class="hidden" style="display:flex; gap:8px; margin-bottom:16px;">
      <button id="chSubBtn" class="primaryBtn" style="width:auto; padding:8px 20px; margin-top:0;"></button>
      <button id="chHideBtn" class="secondaryBtn hidden" style="width:auto; padding:8px 20px; margin-top:0;"></button>
    </div>

    <!-- ПАНЕЛЬ УПРАВЛЕНИЯ (видна только создателю/админам) -->
    <div id="chManagePanel" class="hidden">
      <div class="manage-toolbar">
        <button id="chComposeBtn" class="secondaryBtn" style="width:auto;">Написать на стену</button>
        <button id="chPeopleBtn" class="secondaryBtn" style="width:auto;">Люди</button>
        <button id="chSettingsBtn" class="secondaryBtn hidden" style="width:auto;">Настройки канала</button>
      </div>

      <!-- инлайн-композер поста от имени канала -->
      <div id="chComposer" class="hidden create-channel-form" style="margin-top:12px;">
        <textarea id="chPostText" placeholder="Что нового у канала?"></textarea>
        <div id="chPostImageStrip" class="image-strip"></div>
        <div style="display:flex; align-items:center; gap:10px; margin-top:6px;">
          <label class="attachBtn nf" for="chPostImageInput">&#xf0c6;</label>
          <input type="file" id="chPostImageInput" accept="image/*" multiple hidden>
          <button id="chPublishBtn" class="publishBtn" style="margin-left:auto;">Опубликовать</button>
        </div>
      </div>
    </div>

    <div class="section-title">Стена канала</div>
    <div id="chWall" class="feed-list"><div class="stub-note">Загружаю...</div></div>

  </section>
</main>

<!-- МОДАЛКА "ЛЮДИ" -->
<div id="peopleModal" class="modal hidden">
  <div class="modal-content">
    <button class="closeBtn modalClose" id="closePeopleModal"><span class="nf">&#xf00d;</span></button>
    <h2>Люди</h2>
    <div class="manage-toolbar">
      <button id="addPeopleBtn" class="secondaryBtn" style="width:auto;">Добавить людей</button>
      <button id="assignAdminBtn" class="secondaryBtn" style="width:auto;">Назначить управляющих</button>
    </div>
    <div id="subscribersList" class="people-list" style="margin-top:12px;"></div>
  </div>
</div>

<!-- МОДАЛКА НАСТРОЕК КАНАЛА (только создатель) -->
<div id="channelSettingsModal" class="modal hidden">
  <div class="modal-content">
    <button class="closeBtn modalClose" id="closeSettingsModal"><span class="nf">&#xf00d;</span></button>
    <h2>Настройки канала</h2>
    <label for="csAvatarInput" class="avatar-edit-wrap" style="display:block; text-align:center;">
      <img id="csAvatar" src="assets/anon.svg" class="avatar-lg" style="width:72px;height:72px;">
      <span class="avatar-edit-badge nf">&#xf040;</span>
    </label>
    <input type="file" id="csAvatarInput" accept="image/*" hidden>
    <input id="csName" class="inlineEdit" placeholder="Название" style="margin-top:14px;">
    <div class="username-row">@ch_<input id="csUsername" class="inlineEdit small" placeholder="username"></div>
    <textarea id="csDescription" class="create-channel-form" placeholder="Описание" style="width:100%; min-height:70px; background:var(--card); border:1px solid #3a2f47; border-radius:10px; padding:10px; color:var(--text);"></textarea>
    <button id="csSaveBtn" class="primaryBtn">Сохранить</button>
    <hr>
    <div class="section-title" style="margin-top:0;">Админы</div>
    <div id="csAdminsList"></div>
  </div>
</div>

<!-- ВЫПАДАШКА ПРОФИЛЯ -->
<div id="profileDropdown" class="profile-dropdown hidden">
  <div id="ddLoggedOut">
    <p class="muted" style="margin-top:0;">Ты не вошёл(а) ♡</p>
    <button id="googleLoginBtn" class="primaryBtn">Войти через Google</button>
  </div>
  <div id="ddLoggedIn" class="hidden">
    <div class="dropdown-user-row">
      <img id="ddAvatar" src="assets/anon.svg" class="avatar-sm">
      <div>
        <div id="ddNickname" class="nick-sm"></div>
        <div id="ddUsername" class="muted" style="font-size:12px;"></div>
      </div>
    </div>
    <a href="profile.html" class="dropdownBtn"><span class="nf">&#xf007;</span> Профиль</a>
    <a href="my-channels.html" class="dropdownBtn"><span class="nf">&#xf292;</span> Мои каналы</a>
    <a href="settings.html" class="dropdownBtn"><span class="nf">&#xf013;</span> Настройки</a>
    <hr>
    <button id="logoutBtn" class="dangerBtn">Выйти</button>
  </div>
</div>

<!-- ПРОСМОТР ЧУЖОГО ПРОФИЛЯ -->
<div id="viewProfileModal" class="modal hidden">
  <div class="modal-content">
    <button class="closeBtn modalClose" id="closeViewProfile"><span class="nf"></span></button>
    <div class="profile-head">
      <span class="avatar-wrap" style="width:64px;height:64px;">
        <img id="vpAvatar" src="assets/anon.svg" class="avatar-shaped shape-circle" style="width:64px;height:64px;">
        <span class="avatar-status" id="vpStatus"></span>
      </span>
      <div>
        <div id="vpNickname" class="nick-lg"></div>
        <div class="muted">@<span id="vpUsername"></span></div>
        <div class="profile-bio" id="vpBio" style="font-size:13px;"></div>
      </div>
    </div>
    <a id="vpFullProfileLink" href="#" class="viewFullProfileLink">Открыть профиль полностью &#8594;</a>
    <div id="vpPosts" class="feed-list"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module" src="js/channel-page.js"></script>
</body>
</html>
